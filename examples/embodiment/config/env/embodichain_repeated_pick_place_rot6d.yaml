env_type: embodichain
gym_config_path: embodichain_tasks/configs/tasks/manipulation/repeated_pick_place/task.franka.rlinf_rot6d.yaml

observation_mapping:
  main_images: sensor/cam_high/color
  states:
    - robot/eef_pose
  state_representation: xyz_rot6d_gripper

action_adapter:
  type: eef_pose_rot6d_gripper
action_key: eef_pose

task_description: Pick up the cube and place it on the marked target.
state_keys: [qpos, qvel, qf]
headless: true
seed: 0
auto_reset: true
ignore_terminations: false
max_episode_steps: 240
gripper_state_low: 0.0
gripper_state_high: 0.04
