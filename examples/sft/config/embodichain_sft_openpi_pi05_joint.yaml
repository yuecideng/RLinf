defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0

runner:
  task_type: sft
  logger:
    log_path: ../results/embodichain_sft_openpi_pi05_joint
    project_name: rlinf
    experiment_name: embodichain_sft_openpi_pi05_joint
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 1000

data:
  train_data_paths:
    - dataset_path: ${oc.env:EMBODICHAIN_LEROBOT_JOINT_DATA,/path/to/embodichain_repeated_pick_place_joint}
      weight: 1.0

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 32
  seed: 0
  model:
    model_type: openpi
    model_path: ${oc.env:PI05_MODEL_PATH,/path/to/pi05_model}
    num_action_chunks: 10
    action_dim: 8
    add_value_head: false
    num_steps: 5
    openpi:
      task: sft
      config_name: pi05_rlt_maniskill_joint
      num_images_in_input: 2
      action_horizon: 10
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      model_action_dim: 32
      train_expert_only: false
      discrete_state_input: true
    openpi_data:
      repo_id: embodichain_repeated_pick_place_joint
      default_prompt: Pick up the cube and place it on the marked target.
      norm_stats_path: ${oc.env:EMBODICHAIN_JOINT_NORM_STATS,/path/to/norm_stats.json}
  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 500
    lr_scheduler: cosine
    num_cycles: 0.5
    min_lr: 2.5e-6
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
