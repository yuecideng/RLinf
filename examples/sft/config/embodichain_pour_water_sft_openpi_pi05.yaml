defaults:
  - embodichain_pour_water_sft_openpi_pi05_smoke
  - _self_

runner:
  logger:
    experiment_name: "embodichain_pour_water_pi05"
  max_steps: 30000
  save_interval: 1000

data:
  # Override EMBODICHAIN_POUR_FORMAL_DATA after formal generation.
  train_data_paths: ${oc.env:EMBODICHAIN_POUR_FORMAL_DATA,/workspace/datasets/embodichain_pi05_formal/pour_water/train/cobotmagic_Commercial_pour_water_000}
  num_workers: 4

cluster:
  component_placement:
    actor,env,rollout: 3-6

actor:
  seed: 0
  fsdp_config:
    checkpoint_format: dcp
  model:
    openpi_data:
      # Formal stats must be computed from the formal train split, never smoke.
      norm_stats_path: ${oc.env:EMBODICHAIN_POUR_FORMAL_NORM_STATS,/workspace/datasets/embodichain_pi05_formal/pour_water/train/cobotmagic_Commercial_pour_water_000/norm_stats.json}
  optim:
    total_training_steps: 30000
    lr_warmup_steps: 1000
