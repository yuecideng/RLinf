defaults:
- embodichain_stack_cube_sft_openpi_pi05
- _self_
runner:
  logger:
    experiment_name: embodichain_stack_cube_pi05_smoke
  max_steps: 1000
  save_interval: 100
data:
  train_data_paths: ${oc.env:STACK_CUBE_TRAIN_DATA,/workspace/datasets/embodichain_stack_cube/smoke/train}
  num_workers: 2
  stateful_loader: false
actor:
  model:
    openpi_data:
      norm_stats_path: ${oc.env:STACK_CUBE_NORM_STATS,/workspace/datasets/embodichain_stack_cube/smoke/train/norm_stats.json}
  optim:
    total_training_steps: 1000
    lr_warmup_steps: 100
