# Train-only statistics must be computed before launch. Evaluate exported
# checkpoints externally; the VLA SFT worker has no built-in validation.
defaults:
- model/pi0_5@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
cluster:
  num_nodes: 1
  component_placement:
    actor: all
runner:
  task_type: sft
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: embodichain_stack_cube_pi05
    logger_backends:
    - tensorboard
  max_epochs: -1
  max_steps: 15000
  val_check_interval: -1
  save_interval: 1000
  resume_dir: null
data:
  train_data_paths: ${oc.env:STACK_CUBE_TRAIN_DATA,/workspace/datasets/embodichain_stack_cube/formal/train}
  num_workers: 4
  stateful_loader: true
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 32
  seed: 0
  model:
    model_path: ${oc.env:PI05_BASE_MODEL,/workspace/models/pi05_base}
    action_dim: 7
    num_action_chunks: 5
    openpi:
      config_name: pi05_isaaclab_stack_cube
      action_horizon: 10
      action_chunk: 5
      action_env_dim: 7
      num_images_in_input: 2
      eval_sft_image_crop: true
      num_steps: 5
      discrete_state_input: false
      torch_compile: false
    openpi_data:
      norm_stats_path: ${oc.env:STACK_CUBE_NORM_STATS,/workspace/datasets/embodichain_stack_cube/formal/train/norm_stats.json}
  optim:
    lr: 2.5e-05
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 30000
    lr_warmup_steps: 1000
    lr_scheduler: openpi_cosine
    num_cycles: 0.5
    min_lr: 0.0
  fsdp_config:
    sharding_strategy: no_shard
    use_orig_params: true
    checkpoint_format: dcp
    checkpoint_communication_backend: gloo
    save_full_model_weights: true
    training_state_save_interval: 1000
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
