id: RLinf-StackCube-Expert-v1
physics: default
max_episodes: 1
max_episode_steps: 600
num_envs: 1
arena_space: 2.5
scene:
  component: scene.yaml
task_program:
  program: task_program/program.yaml
  integration: task_program/integration.yaml
  execution_policy: ../../../components/execution_policies/stack_cube.yaml
embodiment:
  component: ../../../components/embodiments/isaaclab_panda.yaml
env:
  target_control_frequency: 20
  rewards:
    success:
      func: success_reward
      mode: add
      weight: 1.0
      params: {}
  events:
    requests:
      func: StackCubeReset
      mode: reset
      params:
        arm_part: arm
        contact_lift: 0.1
        entity_cfgs:
        - uid: blue
        - uid: red
        - uid: green
        ground_plane_visible: false
  dataset: {}
  actions:
    arm:
      contract: eef_pose.relative_substep_dls@1
      params:
        part_name: arm
        translation_scale: 0.5
        rotation_scale: 0.5
        damping: 0.01
    gripper:
      func: ParallelGripperAction
      params:
        part_name: hand
        command_mode: binary
        open_on_zero: false
        open_command:
          panda_finger_joint[1-2]: 0.04
        close_command:
          panda_finger_joint[1-2]: 0.0
  observations:
    eef_state:
      func: stack_cube_state
      mode: add
      name: robot/eef_state
      extra:
        shape:
        - 8
      params:
        link_name: panda_hand
        offset:
        - 0.0
        - 0.0
        - 0.1034
        gripper_part: hand
  expert_trajectory:
    use_action_manager: true
